<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- App icon foreground: a white map pin whose center glows with the heat-map gradient. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="heat" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FF2D2D"/>
            <stop offset="0.45" stop-color="#FF6B35"/>
            <stop offset="0.8" stop-color="#FCA311"/>
            <stop offset="1" stop-color="#FFE066"/>
        </radialGradient>
        <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FF6B35" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <!-- soft heat halo behind the pin -->
    <circle cx="228" cy="214" r="120" fill="url(#glow)"/>
    <!-- pin body -->
    <path d="M228 120c-47 0-85 37-85 83 0 62 85 149 85 149s85-87 85-149c0-46-38-83-85-83z" fill="#FFFFFF"/>
    <!-- hot spot inside the pin -->
    <circle cx="228" cy="203" r="44" fill="url(#heat)"/>
</svg>
